name: gymapp_v2
description: App per automatizzare la scheda palestra
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
  vibration: ^3.1.3
  http: ^1.2.0
  url_launcher: ^6.2.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^22.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  watch_connectivity: ^0.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

