name: Build APK

# Compila l'app a ogni push su main (e a mano dalla scheda Actions).
# Produce due APK: telefono e orologio (Wear OS), pubblicati nelle Releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK ${{ matrix.variante }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variante: [telefono, orologio]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Controllo secret della firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Mancano i secret KEYSTORE_B64 e/o KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Genera la cartella android (bootstrap)
        run: bash scripts/bootstrap.sh ${{ matrix.variante }}

      - name: Firma con il keystore fisso
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          # Alias e password della chiave sono facoltativi:
          # se mancano si usano "gymapp" e la stessa password del keystore.
          ALIAS="${KEY_ALIAS:-gymapp}"
          KPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KPASS"
          } > android/key.properties
          echo "=== SHA-1 del keystore (da registrare in Firebase per l'accesso Google) ==="
          keytool -list -v -keystore android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" 2>/dev/null \
            | grep -E 'SHA1:|SHA256:' || echo "::warning::Alias '$ALIAS' non trovato nel keystore: controlla il secret KEY_ALIAS."

      - name: Controllo errori del codice
        if: matrix.variante == 'telefono'
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Test automatici
        if: matrix.variante == 'telefono'
        continue-on-error: true
        run: flutter test test/logica

      - name: Build APK
        run: |
          if [ "${{ matrix.variante }}" = "orologio" ]; then
            TARGET="--target lib/main_wear.dart"
            NOME="gymapp-orologio-${{ github.run_number }}.apk"
          else
            TARGET=""
            NOME="gymapp-${{ github.run_number }}.apk"
          fi
          # BUILD_NUMBER serve all'app per capire se c'è un aggiornamento.
          # Fino a 3 tentativi: a volte il download dell'NDK arriva rovinato.
          for TENTATIVO in 1 2 3; do
            if flutter build apk --release --build-number=${{ github.run_number }} \
                --dart-define=BUILD_NUMBER=${{ github.run_number }} $TARGET; then
              break
            fi
            if [ "$TENTATIVO" = "3" ]; then
              echo "::error::Build fallita dopo 3 tentativi"
              exit 1
            fi
            echo "::warning::Build fallita (tentativo $TENTATIVO), riprovo tra 30 secondi"
            # Via eventuali NDK scaricati a metà, così si riscaricano puliti.
            for d in "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/*; do
              [ -f "$d/source.properties" ] || rm -rf "$d"
            done
            sleep 30
          done
          mkdir -p uscita
          cp build/app/outputs/flutter-apk/app-release.apk "uscita/$NOME"
          ls -la uscita

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variante }}
          path: uscita/*.apk
          retention-days: 7

  release:
    name: Pubblica nelle Releases
    needs: build
    # Si pubblica anche se fallisce solo l'orologio: l'APK del telefono basta.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apk
          merge-multiple: true

      - name: Controllo APK del telefono
        run: |
          ls -la apk || true
          if [ ! -f "apk/gymapp-${{ github.run_number }}.apk" ]; then
            echo "::error::Manca l'APK del telefono: niente release"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GymApp build ${{ github.run_number }}
          prerelease: true
          body: |
            Commit: ${{ github.event.head_commit.message }}
            - gymapp-${{ github.run_number }}.apk → telefono
            - gymapp-orologio-${{ github.run_number }}.apk → orologio (Wear OS)
          files: apk/*.apk
