# Controllo veloce del codice sui rami di prova (non main): nessun APK,
# nessuna release, nessuna webapp pubblicata.
name: Controllo

on:
  push:
    branches-ignore: [main]

jobs:
  analizza:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analisi (solo errori bloccano)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
